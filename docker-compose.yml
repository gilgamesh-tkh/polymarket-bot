version: '3.8'

services:
  # Main application
  app:
    build: .
    container_name: polymarket-smart-money-app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=duckdb:///app/data/polymarket_data.duckdb
      - CONFIG_FILE=/app/config/config.yaml
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
      - ./results:/app/results
    ports:
      - "8501:8501"  # Streamlit dashboard
      - "8000:8000"  # FastAPI (if enabled)
    depends_on:
      - database
    networks:
      - polymarket-network
    restart: unless-stopped

  # DuckDB database
  database:
    image: duckdb/duckdb:latest
    container_name: polymarket-database
    environment:
      - DUCKDB_DATA_DIR=/data
    volumes:
      - ./data:/data
    networks:
      - polymarket-network
    restart: unless-stopped
    command: duckdb --server

  # Jupyter notebook (for development)
  jupyter:
    build: .
    container_name: polymarket-jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
      - ./notebooks:/app/notebooks
      - ./results:/app/results
    ports:
      - "8888:8888"
    networks:
      - polymarket-network
    profiles:
      - dev

  # Redis cache (optional)
  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    ports:
      - "6379:6379"
    networks:
      - polymarket-network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - cache

  # PostgreSQL database (optional, for production)
  postgres:
    image: postgres:15-alpine
    container_name: polymarket-postgres
    environment:
      - POSTGRES_DB=polymarket_analysis
      - POSTGRES_USER=polymarket_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-polymarket_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - polymarket-network
    restart: unless-stopped
    profiles:
      - production

  # Monitoring and logging
  prometheus:
    image: prom/prometheus:latest
    container_name: polymarket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - polymarket-network
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: polymarket-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    networks:
      - polymarket-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  polymarket-network:
    driver: bridge

# Build context for Dockerfile
build:
  context: .
  dockerfile: Dockerfile